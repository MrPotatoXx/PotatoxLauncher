appId: 'me.potatox.launcher'
productName: 'Potatox Launcher'
artifactName: '${productName}-setup-${version}.${ext}'

copyright: 'Copyright © 2026 Potatox. Basado en Helios Launcher, Copyright © 2018-2026 Daniel Scalzi (MIT)'

asar: true
compression: 'maximum'

files:
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,eslint.config.mjs}'

extraResources:
  - 'libraries'

# Windows Configuration
win: 
  target: 
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  # Nombre fijo para que la web enlace a /releases/latest/download/Potatox-Launcher-setup.exe
  artifactName: 'Potatox-Launcher-setup.${ext}'

# macOS Configuration
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: '${productName}-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

# Linux Configuration
linux: 
  target: 'AppImage'
  maintainer: 'MrPotatoXx'
  vendor: 'Potatox'
  synopsis: 'Launcher de Minecraft para los servidores de Potatox'
  description: 'Launcher de los servidores de Potatox. Instala Java, Minecraft, Forge y los mods del modpack, y los mantiene sincronizados con el servidor.'
  category: 'Game'


directories:
  buildResources: 'build'
  output: 'dist'

# Releases en GitHub (también genera app-update.yml para el auto-updater)
publish:
  provider: github
  owner: MrPotatoXx
  repo: PotatoxLauncher
  releaseType: release